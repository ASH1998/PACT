# Example PACT operator grant.
#
# A grant is the authority ceiling for an agent/session. It is controlled by the
# operator, NOT the agent. The per-task intent can only narrow within it.
#
# Run with:  python3 pact_chat.py --grant examples/grant.pokemon.yaml
#
# This grant authorizes outbound email only to the pokemon.com domain, web reads
# only to pokemon docs + python docs, and file reads only under the repo. Anything
# outside these allowlists is blocked by PACT regardless of what the agent asks.

# Tools the agent may ever use ("*" = all registered tools; or list explicitly).
tools: "*"

# Per-resource-type allowlists. Empty list = deny. "*" = allow all.
resource_scope:
  email_address:
    - "*@pokemon.com"          # outbound email only to pokemon.com
  email_id:
    - "*"
  url:
    - "*.pokemon.com"
    - "docs.python.org"
  file_path:
    - "*.md"                # docs/readmes
    - "src/*"
    - "backend/*"
  command:
    - "ls"
    - "cat"