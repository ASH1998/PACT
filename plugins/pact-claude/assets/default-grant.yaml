# Default PACT grant for Claude Code.
#
# Conservative by design: Claude Code may read normal repo files, read web
# pages, summarize, and respond to the user. Secret reads, file writes, and
# shell execution require approval (or a wider operator grant supplied with
# /pact start --grant <path>).

tools:
  - file.read
  - web.read
  - summarize
  - respond_to_user

resource_scope:
  file_path:
    - "*.md"
    - "docs/*"
    - "backend/*"
    - "frontend/*"
    - "demo/*"
    - "clients/*"
    - "plugins/*"
    - "examples/*"
    - "protocol/*"
  url:
    - "*"
  email_id:
    - "*"
  email_address: []
  command: []
